[project]
name = "CatchUp"
version = "0.2.4"
description = "A backend server for CatchUp."
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = [
    # --- Core Server ---
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "python-multipart",
    # --- AI & RAG ---
    "langchain",
    "langchain-community",
    "langchain-cohere",
    "langchain-openai",
    "langchain-postgres>=0.0.16",
    "langchain-aws>=1.2.2",
    "langchain-text-splitters",
    "langfuse",
    "langgraph",
    "openai",
    "tiktoken",
    "cohere",
    # --- Authorization ---
    "pyjwt",
    "pydantic[email]",
    # --- Database & Utils ---
    "redis",
    "sqlalchemy",
    "psycopg-binary>=3.3.2",
    "langchain-neo4j>=0.8.0",
    # --- Slack ---
    "slack-sdk>=3.39.0",
    "aiodns",
    "githubkit>=0.14.3",
    "cryptography>=46.0.4",
    "jinja2>=3.1.6",
    "apscheduler>=3.11.2",
    "ragas>=0.4.3",
    "alembic>=1.18.4",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "openpyxl>=3.1.5",
    "structlog>=25.5.0",
    "langgraph-checkpoint-postgres>=3.0.4",
]

# 개발 전용 의존성
[dependency-groups]
dev = [
    "debugpy>=1.8.20",
    "pip-licenses",
    "pydeps>=3.0.2",
    "ruff",
]

[tool.uv]
package = false
