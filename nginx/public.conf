# HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name 0-0-0-0.example.io auth.0-0-0-0.example.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Keycloak 전용 (auth.)
server {
    listen 443 ssl;
    server_name auth.0-0-0-0.example.io;

    ssl_certificate /etc/letsencrypt/live/0-0-0-0.example.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/0-0-0-0.example.io/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://10.0.0.1:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }
}

# 메인 서비스 (일반 IP 도메인)
server {
    listen 443 ssl default_server;
    server_name 0-0-0-0.example.io;
    
    # Docker 내부 DNS 설정
    resolver 127.0.0.11 valid=10s;

    ssl_certificate /etc/letsencrypt/live/0-0-0-0.example.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/0-0-0-0.example.io/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        # 변수를 사용하여 동적 해석 유지
        set $backend_url http://api_server:8000;
        proxy_pass $backend_url;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        # 변수를 사용하여 동적 해석 유지
        set $frontend_url http://web_client:3000;
        proxy_pass $frontend_url;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}