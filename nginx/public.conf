upstream backend { server api_server:8000; }
upstream frontend { server web_client:3000; }

# HTTP -> HTTPS 리다이렉트 & Certbot 인증
server {
    listen 80;

    server_name 0-0-0-0.example.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS(443) 실제 서비스
server {
    listen 443 ssl;
    server_name 0-0-0-0.example.io;

    ssl_certificate /etc/letsencrypt/live/0-0-0-0.example.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/0-0-0-0.example.io/privkey.pem;

    # SSL 보안 설정
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # API 요청
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        
        # 스트리밍 설정
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # ALB가 없으므로 Nginx가 직접 https임을 알려줘야 함
        proxy_set_header X-Forwarded-Proto https;
    }

    # 프론트엔드 요청
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        # ALB가 없으므로 Nginx가 직접 https임을 알려줘야 함
        proxy_set_header X-Forwarded-Proto https;
    }
}