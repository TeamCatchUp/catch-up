# 설명
# QA 서버는 develop 브랜치만 바라보며 지속적으로 업데이트 된다.
# Releases용 코드는 main 브랜치와 git tag를 통해 Docker Hub에 Push 된다.

name: Catch Up CI/CD - Build & Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '배포 사유'
        required: false
        default: ''
  push:
    branches:
      - "develop"
      ## Hotfix QA를 위한 임시 조치
      - "hotfix/**"
    tags: [ "[0-9]*.[0-9]*.[0-9]*" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_REGISTRY_USER_NAME }}
  PROJECT_NAME: teamcatchup

jobs:
  # ===================================
  # Build & Push (백엔드/프론트엔드 병렬 처리)
  # ===================================
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: backend/Dockerfile
            image_name: catchup-backend
            target: prod
          - service: frontend
            context: .
            dockerfile: frontend/Dockerfile
            image_name: catchup-web
            target: runner

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER_NAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{ matrix.image_name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/${{ matrix.image_name }}:cache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:cache,mode=max', env.DOCKER_USERNAME, matrix.image_name) || '' }}

  # =================================
  # QA Server(EC2) Deployment
  # =================================
  deploy:
    name: Deploy to QA Server (EC2)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/hotfix/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd ~/CatchUp || { echo "Directory not found"; exit 1; }
            BRANCH_NAME="${{ github.ref_name }}"
            
            git fetch origin
            git checkout -f "$BRANCH_NAME"
            git reset --hard "origin/$BRANCH_NAME"

            cat << 'EOF' > .env
            ${{ secrets.DOTENV_FILE }}
            EOF
            
            echo "IMAGE_TAG=sha-${{ github.sha }}" >> .env
            echo "DOCKER_REGISTRY_URL=${{ secrets.DOCKER_REGISTRY_USER_NAME }}" >> .env
            
            echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_REGISTRY_USER_NAME }}" --password-stdin

            # 이미지 pull
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.public.yml \
              -f docker-compose.auth.yml \
              pull api_server web_client

            # 컨테이너 재시작
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.public.yml \
              -f docker-compose.auth.yml \
              --profile full \
              up -d --remove-orphans

            # 리소스 정리
            docker image prune -a -f
