services:
  api_server:
    container_name: catchup_server
    profiles: ["backend", "full"] 
    depends_on:
      vector_db:
        condition: service_started
      graph_db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - catchup_net
    environment:
      - DB_HOST=vector_db
      - DB_DATABASE=${DB_DATABASE:-catchup}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - NEO4J_URI=bolt://graph_db:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - REDIS_URL=redis://redis:6379/0

  vector_db:
    container_name: catchup_vectordb
    image: pgvector/pgvector:pg16
    profiles: ["backend", "full"]
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-catchup}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - catchup_net
    restart: always

  graph_db:
    container_name: catchup_graphdb
    image: neo4j:5.15-community
    profiles: ["backend", "full"]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    networks:
      - catchup_net
    restart: always

  redis:
    container_name: catchup_redis
    image: redis/redis-stack-server:7.2.0-v13
    profiles: ["backend", "full"]
    volumes:
      - redis_data:/data
    networks:
      - catchup_net
    restart: always

networks:
  catchup_net:
    driver: bridge

volumes:
  pg_data:
  neo4j_data:
  redis_data: