# ====================
# DEVELOPMENT (Local)
# ====================
services:
  api_server:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: dev
    volumes:
      - ./backend/catchup:/app/catchup
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/uv.lock:/app/uv.lock
      - ./backend/.secrets:/app/.secrets
    env_file:
      - .env
    environment:
      - LOG_LEVEL=DEBUG
      - DB_HOST=${DB_HOST}
      - ENABLE_NEO4J=False
    ports:
      - "8000:8000"
    command: uvicorn catchup.server.main:app --host 0.0.0.0 --port 8000 --reload

  web_client:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://api_server:8000
    ports:
      - "3000:3000"
    command: npm run dev

  redis:
    ports:
      - "6379:6379"